function compare(){nav('compare');var ids=compareSet(),chosen=PRODUCTS.filter(function(p){return ids.indexOf(p.id)>=0});app.innerHTML=layout('能力对比工作台','最多选择4款产品。只展示公开能力标签，不生成总体评分。','<div class="panel"><div class="compare-tools">'+PRODUCTS.map(function(p){return '<label class="check"><input type="checkbox" data-pick="'+p.id+'" '+(ids.indexOf(p.id)>=0?'checked':'')+'>'+esc(p.name)+'</label>'}).join('')+'</div></div><div style="height:10px"></div>'+(chosen.length?'<div class="table-wrap"><table><thead><tr><th>维度</th>'+chosen.map(function(p){return '<th>'+esc(p.name)+'</th>'}).join('')+'</tr></thead><tbody>'+CAP.map(function(k,i){return '<tr><th>'+k+'</th>'+chosen.map(function(p){return '<td><b>'+esc(p.caps[i]||'—')+'</b></td>'}).join('')+'</tr>'}).join('')+'<tr><th>主要交付</th>'+chosen.map(function(p){return '<td>'+esc(p.deliver)+'</td>'}).join('')+'</tr></tbody></table></div>':'<div class="empty">请选择2—4款产品开始比较。</div>'));$$('[data-pick]').forEach(function(c){c.onchange=function(){var a=compareSet(),id=c.getAttribute('data-pick');if(c.checked&&a.indexOf(id)<0){if(a.length>=4){c.checked=false;return showToast('比较台最多选择4款产品')}a.push(id)}else if(!c.checked)a=a.filter(function(x){return x!==id});setCompare(a);compare()}})}
function pricing(){nav('pricing');app.innerHTML=layout('价格数据库','价格以报告核验值为准，不做跨币种换算；重点观察计量方式与单位成功任务成本。','<div class="toolbar"><input id="prq" class="input wide" placeholder="搜索产品或计量方式…"><select id="prc" class="select"><option value="all">全部</option><option value="usd">USD</option><option value="cny">CNY</option></select></div><div id="prlist" class="price-grid"></div>');var q=$('#prq'),c=$('#prc'),list=$('#prlist');function go(){var qq=q.value.trim().toLowerCase();var arr=PRICES.filter(function(p){var ok=!qq||(p.name+' '+p.price+' '+p.meta+' '+p.desc).toLowerCase().indexOf(qq)>=0;if(c.value==='usd')ok=ok&&p.price.indexOf('$')>=0;if(c.value==='cny')ok=ok&&p.price.indexOf('¥')>=0;return ok});list.innerHTML=arr.map(function(p){return '<article class="price"><h3>'+esc(p.name)+'</h3><div class="price-main">'+esc(p.price)+'</div><p>'+esc(p.meta)+'</p><p style="margin-top:7px">'+esc(p.desc)+'</p></article>'}).join('')||'<div class="empty">没有匹配价格记录。</div>'}q.oninput=go;c.onchange=go;go()}
function cloneReport(id){var holder=document.createElement('div');holder.innerHTML=FULL;var el=holder.querySelector('#'+id);return el?el.innerHTML:''}
function benchmarks(){nav('benchmarks');var report=cloneReport('sec-8')||cloneReport('report-sec-8')||'';app.innerHTML=layout('Benchmark 与真实任务评测','Benchmark 用于测量，不直接等同产品采购答案。网页、桌面和综合知识环境应分开理解。', '<div class="grid2"><div class="panel"><h3 style="margin-top:0">OSWorld</h3><p class="muted" style="font-size:11px">开放式桌面 GUI 任务，关注电脑操作型 Agent 的多步骤执行。</p>'+stag('S31')+'</div><div class="panel"><h3 style="margin-top:0">WebArena-Verified</h3><p class="muted" style="font-size:11px">真实感网页环境，关注导航、表单、检索与跨页面任务。</p>'+stag('S32')+'</div></div><div class="section"><h2>报告原文中的 Benchmark 分析</h2><div class="panel">'+(report||'<p class="muted">原报告章节未解析到，直接打开完整报告。</p>')+'</div></div><div class="section"><h2>建议验收指标</h2><div class="grid4">'+[['任务完成率','30%'],['关键步骤正确率','20%'],['事实/数字准确率','15%'],['人工介入率','10%'],['返工率','10%'],['平均耗时','5%'],['单位成功任务成本','5%'],['风险事件率','5%']].map(function(x){return '<div class="research-card"><b style="font-size:18px;color:var(--brand)">'+x[1]+'</b><p style="margin-top:4px"><b>'+x[0]+'</b></p></div>'}).join('')+'</div></div>')}
function security(){nav('security');var report=cloneReport('sec-9')||'';app.innerHTML=layout('安全与治理数据库','Agent 的风险从“答错”扩展到“做错”。这里用于建立控制边界，不是对任何产品做风险评级。','<div class="risk-grid">'+[['提示注入','高','网页、文档或工具返回内容可能诱导 Agent 偏离原任务。','上下文隔离、可信域限制、关键动作确认'],['数据外泄','高','完成任务往往需要访问本地文件、云盘、邮件或连接器。','最小权限、专用目录、敏感资料分级'],['误操作','高','购买、发送、发布、删除等动作具有现实副作用。','人工审批、提交前预览、可逆操作'],['权限扩张','高','为了提高完成率可能一次性给出过宽权限。','最小权限、独立账号、短期授权'],['长任务失控','中高','长任务可能重复、偏离目标或消耗过多额度。','预算、超时、阶段验收、恢复'],['事实错误','中高','报告可能完整但证据不足。','来源分级、引用校验、Verifier'],['工具供应链','中','第三方 Skills/MCP Server 增加攻击面。','来源审核、白名单、版本锁定'],['隐私残留','中','Memory、Projects 和日志形成长期上下文。','定期清理、敏感内容不进入长期记忆']].map(function(x){return '<article class="risk"><span class="risk-level '+(x[1]==='高'?'high':'mid')+'">'+x[1]+'</span><h3>'+x[0]+'</h3><p>'+x[2]+'</p><small><b>控制：</b>'+x[3]+'</small></article>'}).join('')+'</div><div class="section"><h2>完整报告中的安全分析</h2><div class="panel">'+report+'</div></div><div class="section"><h2>安全参考来源</h2><div>'+['S03','S33','S39'].map(stag).join('')+'</div></div>')}
function sources(){nav('sources');app.innerHTML=layout('来源库','41项公开来源。正文、产品档案和时间线都通过来源编号回溯。','<div class="toolbar"><input id="sq" class="input wide" placeholder="搜索来源编号、标题、机构…"></div><div id="slist" class="source-grid"></div>');var q=$('#sq'),list=$('#slist');function go(){var qq=q.value.trim().toLowerCase();var arr=SOURCES.filter(function(s){return !qq||(s.id+' '+s.title+' '+s.meta).toLowerCase().indexOf(qq)>=0});list.innerHTML=arr.map(function(s){return '<article class="source" id="source-'+s.id+'"><span class="source-id">['+esc(s.id)+']</span><h3>'+esc(s.title)+'</h3><p>'+esc(s.meta)+'</p><a href="'+esc(s.url)+'" target="_blank" rel="noopener">打开原始来源 ↗</a></article>'}).join('')||'<div class="empty">没有匹配来源。</div>'}q.oninput=go;go();var f=route().params.get('focus');if(f)setTimeout(function(){var el=$('#source-'+f);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},60)}
function report(){nav('report');app.innerHTML=layout('完整研究报告','保留19章原始研究正文。数据库页面从该正文中解析结构化产品、价格和来源数据。','<div class="panel"><h3 style="margin-top:0">打开19章完整报告</h3><p class="muted" style="font-size:11px">包含研究范围、产品演进、产品全景、能力架构、关键场景、价格、Benchmark、安全、MCP/A2A、选型、企业导入、趋势、评测、来源与核验限制。</p><a class="btn primary" href="full.html" target="_blank">阅读完整研究报告 ↗</a></div>')}
